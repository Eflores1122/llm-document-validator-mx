[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "docval"
version = "0.1.0"
description = "Reference pipeline that parses and validates synthetic Mexican employee-onboarding files."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [{ name = "Edgar Flores" }]
keywords = ["onboarding", "documents", "validation", "llm", "synthetic-data", "mexico"]
classifiers = [
  "Development Status :: 4 - Beta",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Typing :: Typed",
]
dependencies = [
  "pdfplumber>=0.11.0",
  "pydantic>=2.6",
  "pypdf>=5.0.0",
  "reportlab>=4.0",
  "typer>=0.12.0",
]

[project.optional-dependencies]
llm = ["openai>=1.40.0"]
api = ["fastapi>=0.115.0", "uvicorn>=0.30.0"]
dev = [
  "fastapi>=0.115.0",
  "httpx>=0.27.0",
  "pytest>=8.0.0",
  "ruff>=0.6.0",
  "uvicorn>=0.30.0",
]

[project.scripts]
docval = "docval.cli:app"

[project.urls]
Homepage = "https://github.com/Eflores1122/llm-document-validator-mx"
Documentation = "https://eflores1122.github.io/llm-document-validator-mx/"
Repository = "https://github.com/Eflores1122/llm-document-validator-mx"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
docval = ["py.typed"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"src/docval/cli.py" = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
